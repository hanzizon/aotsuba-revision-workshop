name: Disable temp draft auto-restore

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove automatic temp draft restore
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "// 브라우저에 남아 있는 임시저장본이 있으면 시작할 때 자동 복원합니다.\nconst tempDraftRestored=restoreTempDraft();\n"
          new = "// 임시저장본은 자동 복원하지 않고, 사용자가 불러오기 버튼을 눌렀을 때만 복원합니다.\n"
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Disable automatic temp draft restore"
          git push
