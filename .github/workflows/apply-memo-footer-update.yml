name: Apply memo and footer update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='  <div class="footer-signature">아오츠바 츠하자.</div>'
          new='  <div class="footer-note">HWPX는 브라우저에서 직접 읽을 수 있지만, 구형 HWP 바이너리는 지원하지 않습니다. DOCX/HWPX 읽기는 JSZip을 사용하며 인터넷 연결이 필요할 수 있습니다. 겹낫표 또는 쌍따옴표로 묶인 문장은 길이와 관계없이 한 문단으로 분류됩니다. 각 셀은 직접 수정할 수 있습니다.</div>\n  <div class="footer-signature">아오츠바 츠하자.</div>'
          if old not in s: raise SystemExit('footer target not found')
          s=s.replace(old,new,1)

          old='''      <strong>메모장</strong>\n      <span class="memo-status" id="memoStatus">자동 저장</span>\n      <button type="button" class="memo-close" id="memoClose">닫기</button>'''
          new='''      <strong>메모장</strong>\n      <span class="memo-status" id="memoStatus">자동 저장</span>\n      <div class="memo-head-actions">\n        <button type="button" class="memo-reset" id="memoReset">초기화</button>\n        <button type="button" class="memo-close" id="memoClose">닫기</button>\n      </div>'''
          if old not in s: raise SystemExit('memo header target not found')
          s=s.replace(old,new,1)

          old='''.memo-close{\n  margin-left:auto;\n  padding:5px 8px;\n  font-size:10px;\n  color:var(--muted);\n  background:#fff;\n}'''
          new='''.memo-head-actions{\n  margin-left:auto;\n  display:flex;\n  align-items:center;\n  gap:6px;\n}\n.memo-reset,\n.memo-close{\n  padding:5px 8px;\n  font-size:10px;\n  background:#fff;\n}\n.memo-reset{color:var(--accent)}\n.memo-close{color:var(--muted)}'''
          if old not in s: raise SystemExit('memo css target not found')
          s=s.replace(old,new,1)

          old='''document.querySelector("#memoClose")?.addEventListener("click",()=>setMemoOpen(false));\ndocument.querySelector("#memoText")?.addEventListener("input",()=>{'''
          new='''document.querySelector("#memoClose")?.addEventListener("click",()=>setMemoOpen(false));\ndocument.querySelector("#memoReset")?.addEventListener("click",()=>{\n  const memo=document.querySelector("#memoText");\n  if(!memo || !memo.value) return;\n  if(!window.confirm("메모 내용을 모두 지울까요?")) return;\n  memo.value="";\n  try{ localStorage.removeItem(MEMO_STORAGE_KEY); }catch(err){ console.error("메모 초기화 실패",err); }\n  const status=document.querySelector("#memoStatus");\n  if(status){\n    status.textContent="초기화됨";\n    clearTimeout(status.__resetTimer);\n    status.__resetTimer=setTimeout(()=>status.textContent="자동 저장",900);\n  }\n  memo.focus();\n});\ndocument.querySelector("#memoText")?.addEventListener("input",()=>{'''
          if old not in s: raise SystemExit('memo listener target not found')
          s=s.replace(old,new,1)

          old='''    fontSize:document.querySelector("#fontSizeSelect")?.value || "11pt",\n    manualTexts:[...document.querySelectorAll(".drop .manual-text")].map(el=>el.value),\n    memoText:document.querySelector("#memoText")?.value || ""\n  };'''
          new='''    fontSize:document.querySelector("#fontSizeSelect")?.value || "11pt",\n    manualTexts:[...document.querySelectorAll(".drop .manual-text")].map(el=>el.value)\n  };'''
          if old in s: s=s.replace(old,new,1)

          old='''  const memo=document.querySelector("#memoText");\n  if(memo && typeof saved.memoText==="string"){\n    memo.value=saved.memoText;\n    try{ localStorage.setItem(MEMO_STORAGE_KEY,saved.memoText); }catch(err){}\n  }\n\n  document.body.classList.toggle("proof-off",!proofEnabled);'''
          new='''  document.body.classList.toggle("proof-off",!proofEnabled);'''
          if old in s: s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore footer note and improve memo persistence"
          git push
